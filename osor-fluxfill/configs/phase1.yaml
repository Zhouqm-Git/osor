# Phase I: Pretraining (Hard Blending) - FLUX Fill backbone.
# Goal: train the generator (LoRA + terminal projection) and the multi-scale
# discriminator with the occupancy-guided GAN + reconstruction losses under
# hard latent blending. See README.md for the data layout.

project:
  name: OSOR-Flux
  phase: 1
  output_dir: outputs/phase1
  logging_dir: logs

data:
  batch_size: 2                # 8 GPUs x 2 x grad_accum=1 -> global batch 16
  num_workers: 4
  target: src.data.dataset.ObjectRemovalDataset
  params:
    data_root: /path/to/corne
    shot_list: /path/to/corne/shot_list.txt
    mask_list: /path/to/corne/mask_list.txt
    bg_list: /path/to/corne/bg_list.txt

batch:
  target: src.data.batch.IdentityBatchTransform
  params: {}

model:
  base_model_type: flux_fill
  flux_base: /path/to/flux-fill-dev

  fixed_prompt: "Remove the instance of object"
  prompt_embeds_path: "pretrained_weights/fixed_prompt_embeds.pt"

  clip_backbone: /path/to/clip-convnext-xxlarge.bin

  lora:
    rank: 64
    modules: ["attn.to_q", "attn.to_k", "attn.to_v", "attn.to_out.0", "ff.net.0.proj", "ff.net.2", "proj_mlp", "single_transformer_blocks.*.proj_out"]

  model_t: 400
  guidance_scale: 30.0

training:
  seed: 42
  mixed_precision: bf16
  max_steps: 15000
  grad_accum_steps: 1
  grad_checkpointing: true
  max_grad_norm: 1.0

  optimizer:
    type: adam
    lr_g: 1e-5
    lr_d: 1e-5
    betas: [0.9, 0.999]

loss_weights:
  gan: 0.3
  gp: 60000.0
  lpips: 3.0
  l1: 0.5

checkpointing:
  checkpointing_steps: 1000
  checkpoints_total_limit: 50
  resume_from_checkpoint: ~

logging:
  logging_dir: logs
  report_to: tensorboard
  log_image_steps: 50
  log_grad_steps: 100
  log_grad_modules: [proj_out]
